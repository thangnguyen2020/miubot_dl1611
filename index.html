<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Miu-Bot học tiếng Việt</title>
<style>:root{--teal:#2f9e8a;--teal-d:#237a6a;--mint:#d9f5ec;--sun:#ffd23f;--ink:#1f2d3d;--card:#ffffff;--ok:#2fbf71;--soft:#ffe3bf;--blue:#3b82f6;--fs:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"SF Pro Rounded","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#d6f0ff 0%,#eaf8ef 55%,#f7fbe9 100%);background-attachment:fixed;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:1100px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:10px 14px calc(18px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:6px 2px}
header .title{flex:1;font-weight:800;font-size:20px;text-align:center;color:var(--teal-d)}
.hbtn{min-width:52px;height:52px;border-radius:26px;border:0;background:#fff;box-shadow:0 3px 0 #bfe3d8;font-size:24px;padding:0 14px;color:var(--ink)}
.stars{font-weight:800;font-size:20px;display:flex;align-items:center;gap:4px;background:#fff7d6;border-radius:26px;height:52px;padding:0 16px;box-shadow:0 3px 0 #f0d77a}
.progress{display:flex;gap:6px;margin:2px 4px 6px}.progress i{flex:1;height:8px;border-radius:6px;background:#ffffff99}.progress i.on{background:var(--teal)}
.botrow{display:flex;align-items:flex-end;gap:10px;margin:2px 0 8px}
.bot{width:112px;height:134px;flex:none;position:relative;animation:bob 3.2s ease-in-out infinite}
.bot svg{width:100%;height:100%;overflow:visible}
.bot.talk .mouth{animation:talk .28s ease-in-out infinite;transform-origin:100px 112px;transform-box:view-box}
.bot .eyes{animation:blink 4.5s infinite;transform-origin:100px 82px;transform-box:view-box}
.bot.cheer{animation:hop .6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes hop{50%{transform:translateY(-14px)}}
@keyframes talk{50%{transform:scaleY(.55)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bubble{position:relative;background:#fff;border-radius:22px;padding:14px 18px;font-size:calc(22px*var(--fs));line-height:1.5;flex:1;box-shadow:0 3px 0 #cfe6ee;min-height:64px}
.bubble:before{content:"";position:absolute;left:-12px;bottom:22px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.bubble .replay{float:right;margin-left:8px;border:0;background:var(--mint);border-radius:18px;height:40px;min-width:40px;font-size:20px}
main{flex:1}
.card{background:var(--card);border-radius:26px;padding:18px 20px;box-shadow:0 4px 0 #cfe6ee;margin-bottom:12px}
.card h2{margin:0 0 6px;font-size:26px;color:var(--teal-d)}
.sub{margin:0 0 12px;font-size:20px;color:#52606d}
.btn{border:0;border-radius:24px;min-height:64px;padding:0 26px;font-size:22px;font-weight:800;background:var(--teal);color:#fff;box-shadow:0 5px 0 var(--teal-d);display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--teal-d)}
.btn.alt{background:#fff;color:var(--teal-d);box-shadow:0 5px 0 #bfe3d8}
.btn.sun{background:var(--sun);color:#5a4300;box-shadow:0 5px 0 #d9ab00}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 #2563c9}
.btn[disabled]{opacity:.45}
.btn.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;margin:12px 0 4px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pick{border:3px solid #d5e5ea;background:#fff;border-radius:22px;padding:14px;font-size:21px;font-weight:700;text-align:center;min-height:112px;color:var(--ink)}
.pick .em{font-size:44px;display:block;margin-bottom:4px}
.pick.ok{border-color:var(--ok);background:#e4f8ec}.pick.soft{border-color:#f3b76b;background:var(--soft)}
/* path */
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:10px 0}
.node{background:#fff;border-radius:22px;padding:12px;text-align:center;border:3px solid transparent;box-shadow:0 4px 0 #cfe6ee;font-size:19px;font-weight:700;color:var(--ink)}
.node .n{font-size:34px;display:block}.node small{display:block;color:#6b7b8c;font-weight:600;font-size:15px}
.node.done{background:#e4f8ec}.node.cur{border-color:var(--sun);animation:pulse 1.6s infinite}
/* reading */
.scene{font-size:40px;text-align:center;letter-spacing:6px;margin-bottom:6px}
.read{font-size:calc(30px*var(--fs));line-height:2.05;letter-spacing:.012em;word-spacing:.08em}
.read .sent{border-radius:12px;padding:2px 4px;transition:background .2s}
.read .sent.d{display:block;margin-top:4px}
.read .sent.on{background:#fff0a8;box-shadow:0 0 0 3px #fff0a8}
.read .ck{margin-right:.22em}
.gl{border-bottom:3px dotted #f08c00;cursor:pointer}
.ckrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:10px 0 6px}
.pill{font-size:calc(32px*var(--fs));padding:10px 20px;border-radius:24px;background:#eef6ff;border:3px solid #cfe1f7;color:var(--ink);line-height:1.5}
.pill.say{background:#fff0a8;border-color:#f3cf3a}
.pill.you{background:#dbeafe;border-color:var(--blue);animation:pulse 1s infinite}
.pill small{display:block;font-size:15px;color:var(--blue);font-weight:800}
.dots{display:flex;gap:8px;justify-content:center;margin:2px 0 8px}.dots i{width:14px;height:14px;border-radius:50%;background:#cfe1f7}.dots i.on{background:var(--teal)}.dots i.cur{outline:3px solid var(--sun)}
/* tone */
.opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.opt{min-width:160px;border:3px solid #d5e5ea;background:#fff;border-radius:24px;padding:14px 18px;font-size:38px;font-weight:800;text-align:center;color:var(--ink)}
.opt .em{display:block;font-size:48px}.opt small{display:block;font-size:16px;font-weight:600;color:#52606d}
.opt.ok{border-color:var(--ok);background:#e4f8ec}.opt.soft{border-color:#f3b76b;background:var(--soft)}
.legend{font-size:17px;color:#52606d;text-align:center}
/* games */
.leaves{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:10px 0}
.leaf{border:0;font-size:28px;font-weight:800;padding:14px 26px;border-radius:30px 6px 30px 6px;background:#9be08a;color:#1d4d12;box-shadow:0 4px 0 #6dbb5c}
.leaf:nth-child(3n){background:#ffcf6b;box-shadow:0 4px 0 #e0a33a;color:#5a3b00}.leaf:nth-child(3n+1){background:#b7e36f;box-shadow:0 4px 0 #8bbd3f}
.leaf.sel{transform:translateY(-8px) scale(1.12);outline:4px solid var(--blue)}
.leaf.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.basket{border:4px dashed #9cc7d6;border-radius:26px;background:#f4fbff;min-height:150px;padding:10px;text-align:center;font-size:24px;font-weight:800;color:var(--ink)}
.basket .in{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.basket .in span{background:#fff;border-radius:16px;padding:4px 12px;font-size:22px;border:2px solid #cfe1f7}
.basket small{display:block;font-size:16px;font-weight:600;color:#52606d}
.q{font-size:calc(26px*var(--fs));line-height:1.5;font-weight:700;margin:4px 0 12px}
.ans{display:block;width:100%;text-align:left;border:3px solid #d5e5ea;background:#fff;border-radius:22px;padding:16px 18px;margin:10px 0;font-size:calc(23px*var(--fs));line-height:1.45;color:var(--ink)}
.ans.ok{border-color:var(--ok);background:#e4f8ec}.ans.soft{border-color:#f3b76b;background:var(--soft)}
.hint{background:#fff7d6;border-radius:20px;padding:12px 16px;font-size:21px;margin-top:8px}
.order{display:grid;gap:12px}
.ocard{position:relative;border:3px solid #d5e5ea;background:#fff;border-radius:22px;padding:16px 60px 16px 18px;font-size:calc(23px*var(--fs));line-height:1.45;text-align:left;color:var(--ink)}
.ocard .no{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:var(--ok);color:#fff;font-weight:800;font-size:22px;display:none;align-items:center;justify-content:center}
.ocard.ok{border-color:var(--ok);background:#e4f8ec}.ocard.ok .no{display:flex}
.ocard.shake{animation:shake .4s}
/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -8px 30px #0003;padding:20px 22px calc(22px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s;z-index:20;max-width:900px;margin:0 auto}
#sheet.show{transform:none}
#sheet .w{font-size:36px;font-weight:800;color:var(--teal-d)}
#sheet .e{font-size:44px}
#sheet p{font-size:24px;line-height:1.5;margin:6px 0}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-120px);background:#fff;border-radius:24px;padding:12px 22px;font-size:22px;font-weight:800;box-shadow:0 6px 20px #0003;z-index:30;transition:transform .3s}
#toast.show{transform:translate(-50%,0)}
.fall{position:fixed;top:-40px;font-size:34px;z-index:15;pointer-events:none;animation:fall 3.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.parent h3{margin:16px 0 6px;color:var(--teal-d)}.parent p,.parent li{font-size:18px;line-height:1.55;-webkit-user-select:text;user-select:text}
.parent table{border-collapse:collapse;width:100%;font-size:17px}.parent td,.parent th{border-bottom:1px solid #e1e8ed;padding:6px 8px;text-align:left}
.parent input[type=text]{font-size:20px;padding:10px 14px;border-radius:14px;border:2px solid #cfe1f7;-webkit-user-select:text;user-select:text}
.big{font-size:60px;text-align:center}
@media (max-width:640px){.bot{width:84px;height:100px}.bubble{font-size:19px}.read{font-size:26px}.pill{font-size:26px}}

input,textarea{-webkit-user-select:text;user-select:text}
.tin{width:100%;font-size:calc(24px*var(--fs));padding:14px 16px;border-radius:18px;border:3px solid #cfe1f7;background:#fff;color:var(--ink);font-family:inherit}
.tin:focus{outline:none;border-color:var(--blue)}
.field{margin:10px 0}.field label{display:block;font-weight:800;font-size:20px;margin-bottom:6px;color:var(--teal-d)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:3px solid #d5e5ea;background:#fff;border-radius:22px;padding:8px 16px;font-size:20px;color:var(--ink)}
.chip.on{border-color:var(--ok);background:#e4f8ec;font-weight:800}
.tabs{display:flex;gap:10px;margin-bottom:10px}.tabs .btn{flex:1;min-height:56px;font-size:19px}
.zones{display:grid;gap:12px;margin-top:10px}
.zone{border:4px dashed;border-radius:24px;padding:12px 16px;text-align:left;font-size:22px;font-weight:800;color:var(--ink);min-height:96px}
.zone small{display:block;font-weight:600;font-size:17px;color:#445}
.zone.m{background:#e3f1ff;border-color:#8ec3f5}.zone.t{background:#ffe8e4;border-color:#f3a99b}.zone.k{background:#e3f7ec;border-color:#8fd3a9}
.zone .in div{background:#fff;border-radius:14px;padding:6px 12px;margin-top:6px;font-size:18px;font-weight:600}
.scards{display:grid;gap:10px;margin:8px 0}
.scard{border:3px solid #d5e5ea;background:#fff;border-radius:20px;padding:12px 16px;font-size:calc(21px*var(--fs));text-align:left;line-height:1.4;color:var(--ink)}
.scard.sel{border-color:var(--blue);background:#eaf2ff;transform:scale(1.02)}.scard.shake{animation:shake .4s}
.ord{color:#d9480f;font-weight:800}
.segs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.seg{font-size:calc(28px*var(--fs));padding:10px 16px;border-radius:18px;border:3px solid #d5e5ea;background:#fff;color:var(--ink)}
.seg.ok{border-color:var(--ok);background:#e4f8ec;font-weight:800}.seg.soft{border-color:#f3b76b;background:var(--soft)}
.trow{display:flex;gap:8px;align-items:center;margin:8px 0}.trow .o{width:112px;flex:none;font-weight:800;color:#d9480f;font-size:19px}
.trow .mv{flex:none;width:46px;height:46px;border-radius:14px;border:0;background:var(--mint);font-size:20px}
.ol{border-radius:22px;padding:12px 16px;margin:10px 0;font-size:calc(21px*var(--fs));line-height:1.55}
.ol h4{margin:0 0 4px;font-size:22px}.ol.m{background:#e3f1ff}.ol.t{background:#ffe8e4}.ol.k{background:#e3f7ec}
.chk{display:flex;gap:10px;align-items:center;background:#fff;border-radius:18px;padding:10px 14px;margin:8px 0;font-size:21px;border:3px solid #d5e5ea}
.chk.ok{border-color:var(--ok);background:#e4f8ec}.chk .b{margin-left:auto}
.starbtn{flex:none;border:0;background:#fff7d6;border-radius:14px;height:46px;min-width:46px;font-size:22px}.starbtn.on{background:var(--sun)}

/* ===== nhiều bài học ===== */
.lpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.lbtn{border:3px solid #d5e5ea;background:#fff;border-radius:18px;padding:8px 4px;text-align:center;color:var(--ink);font-size:15px;line-height:1.25;display:flex;flex-direction:column;gap:2px}
.lbtn b{font-size:20px}.lbtn small{color:#6b7b8c;font-weight:600}
.lbtn.on{border-color:var(--sun);background:#fff7d6;box-shadow:0 3px 0 #e8c25a}
.baskets.b3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:640px){.baskets.b3{grid-template-columns:1fr}.lbtn{font-size:13px}.lbtn b{font-size:17px}}
.leaves .leaf{font-size:calc(24px*var(--fs))}
.opt.wide{display:block;width:100%;font-size:22px;text-align:left;margin:8px 0}
.chk.tg{width:100%;text-align:left;font-family:inherit;cursor:pointer}
textarea.tin{resize:vertical;min-height:80px;line-height:1.4}
.stars5{display:flex;gap:8px}
.leaf{white-space:normal;text-align:center}
.pick small{display:block;font-size:15px;font-weight:500;color:#52606d;margin-top:4px}
.pick b{font-size:19px}

.lbar{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.hbtn2{border:3px solid #d5e5ea;background:#fff;border-radius:18px;width:54px;font-size:22px;color:var(--ink)}
.hbtn2:disabled{opacity:.35}
.tocbtn{flex:1;border:3px solid var(--sun);background:#fff7d6;border-radius:18px;padding:8px 12px;text-align:left;display:flex;flex-direction:column;gap:1px;color:var(--ink);box-shadow:0 3px 0 #e8c25a}
.tocbtn span{font-size:14px;font-weight:700;color:#8a6a00}.tocbtn b{font-size:19px;line-height:1.25}.tocbtn small{color:#6b7b8c;font-weight:600}
.theme{margin:14px 0}.theme h3{margin:0 0 8px;font-size:20px}
.wk{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.wn{flex:0 0 58px;background:#e8f1ff;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:14px;color:#2c5aa0;padding:4px}
.lts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lt{border:3px solid #d5e5ea;background:#fff;border-radius:16px;padding:8px 10px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;font-size:15px;line-height:1.25}
.lt b{font-size:17px}.lt small{color:#6b7b8c;font-weight:600}
.lt.on{border-color:var(--sun);background:#fff7d6;box-shadow:0 3px 0 #e8c25a}
.lt.full{border-color:#8fd19e}
.lt.off{opacity:.5;background:#f3f5f7;border-style:dashed}
.rv{flex:1;border:3px dashed #d5e5ea;border-radius:16px;padding:10px;color:#6b7b8c;display:flex;align-items:center}
@media(max-width:560px){.lts{grid-template-columns:1fr}}
</style></head><body>

 <li><b>Câu 2:</b> 3 bước. Bước 1 Cắt: hai hình chữ nhật (đầu thỏ rộng 10 cm, thân thỏ rộng 15 cm, cùng dài 25 cm), hình tai thỏ (gấp theo nét đứt), đế bằng giấy màu. Bước 2 Dán: dán hai mép mỗi hình chữ nhật để tạo đầu và thân; dán tai, đầu, thân với nhau rồi dán lên đế. Bước 3 Vẽ: trang trí tai thỏ; vẽ mắt, râu, mũi, miệng ở đầu thỏ và tay ở thân thỏ.</li>
 <li><b>Câu 3:</b> con chọn 1–2 bước và nói bằng từ chỉ thứ tự: đầu tiên, tiếp theo, sau đó, cuối cùng.</li>
 <li><b>Câu 4:</b> chú thỏ giấy là món quà sinh nhật Hà tự tay làm tặng Hoa; có đầu, thân, đôi tai dài, mắt, râu, mũi, miệng vẽ bằng bút màu; đứng vững nhờ đế giấy màu.</li>
 <li><b>Luyện từ và câu 1:</b> vị táo: ngọt, chua ngọt…; mùi hoa hồng: thơm, thơm ngát…; voi: to, to lớn…; mặt trời: đỏ, đỏ rực…; cầu vồng: cong, cong cong…; giờ ra chơi: ồn ào, náo nhiệt, rộn rã…</li>
 <li><b>Câu 2:</b> tính từ của sự vật: vàng ruộm, thơm nồng, nâu sẫm, đỏ rực, xanh mướt, um tùm, nhỏ xíu, tròn xoe, bé nhỏ. Tính từ của hoạt động: nhanh, thoăn thoắt, kín đáo, nhè nhẹ, chậm rãi.<br><i>⚠ File hướng dẫn xếp thêm “cao” vào nhóm sự vật (từ trong cụm “mặt trời đã lên cao”). App để từ này ra ngoài vì dễ gây nhầm; nếu cô giáo hỏi, con có thể nói đó là đặc điểm của vị trí.</i></li>
 <li><b>Câu 3:</b> mẫu: “Bát phở bò mẹ nấu rất nóng hổi và thơm ngon.”; “Bộ váy mẹ mới mua có màu hồng tươi tắn và rất mềm mại.”; “Các bạn thảo luận nhóm rất sôi nổi.”</li>
 <li><b>Câu 4 (trò chơi Đoán đồ vật):</b> bố mẹ và con chơi cùng: bỏ vài đồ vật vào túi; một người mô tả bằng tính từ (không nói tên), người kia đoán. Ví dụ: “Màu đỏ, thân dài, ruột bằng chì” → cái bút chì.</li>
 <li><b>Viết · Tìm hiểu cách viết hướng dẫn:</b> bài “Cách làm một chú nghé ọ bằng lá” (nghé là trâu con). a) hướng dẫn làm nghé ọ bằng lá mít; b) chuẩn bị: lá to bằng bàn tay, hai sợi dây cước nhỏ, kéo hoặc dùng tay; c) 2 bước. Ghi nhớ: bài hướng dẫn thường có 2 phần: chuẩn bị và hướng dẫn thực hiện.</li>
 <li><b>Vận dụng:</b> tìm một bài hướng dẫn làm đồ chơi đơn giản (chong chóng, thuyền giấy, máy bay giấy…) và làm cùng con.</li></ul>
 <h3>Lỗi thường gặp</h3>
 <ul><li>Nhầm nét đứt là đường cắt: nét liền để cắt, nét đứt để gấp.</li><li>Nhầm kích thước đầu thỏ và thân thỏ (10 cm và 15 cm).</li>
 <li>Nhầm tính từ với danh từ hoặc động từ: hỏi “như thế nào?” để tìm tính từ.</li><li>Khi trình bày các bước quên dùng từ chỉ thứ tự.</li></ul>`;}

function parentB22(){return `<h3>Đáp án bài 22 · Bức tường có nhiều phép lạ (theo văn bản SGK)</h3>
 <ul><li><b>Khởi động (mở):</b> một điều tưởng tượng em mong có thật, kèm lí do (đôi cánh thần kì, cánh cửa thần kì, bút chì vẽ gì có nấy…).</li>
 <li><b>Câu 1:</b> không gian nơi Quy ngồi học: bức tường trước mặt, màu vôi xanh mát, hiện ra như tấm màn ảnh rộng.<br><i>⚠ File hướng dẫn viết “bàn học kê sát bức tường quét vôi xanh mát rượi”. Cụm “kê sát”, “mát rượi” không có trong bài đọc.</i></li>
 <li><b>Câu 2:</b> hành động: chống tay, tì má nhìn bức tường, thở dài. Suy nghĩ: “Trời thì nắng mà bài văn lại yêu cầu tả mưa.”<br><i>⚠ File hướng dẫn ghi “cắn bút, vò đầu bứt tai”. Chi tiết này không có trong bài đọc.</i></li>
 <li><b>Câu 3:</b> Quy thấy bố cứ nhìn bức tường một lúc rồi viết lia lịa, quên cả ăn cơm, nên nghĩ bức tường có phép lạ.<br><i>⚠ File hướng dẫn trả lời bằng những hình ảnh Quy thấy sau khi bố gợi ý (thuyền giấy, vai áo ướt, hạt mưa). Đó là nội dung cho câu 5, không phải lí do khiến Quy nghĩ tường có phép lạ.</i></li>
 <li><b>Câu 4:</b> đáp án C: Vì bố muốn gợi cho Quy nhớ lại những trận mưa mà Quy đã gặp. (Sách có 4 lựa chọn A–D; file hướng dẫn chỉ ghi 3.)</li>
 <li><b>Câu 5 (mở):</b> Quy làm được bài vì bố đã giúp em nhớ lại những trận mưa mình từng gặp; những hình ảnh thuyền giấy, vai áo ướt, hạt mưa hiện lên rõ trong đầu em.</li>
 <li><b>Luyện từ và câu 1:</b> tìm 3–5 tính từ có trong bài, ví dụ: xanh mát, ướt sũng, bồng bềnh, rào rào, lia lịa, tủm tỉm.<br><i>⚠ File hướng dẫn nêu “vàng xuộm, xanh biếc, ngọt lành, say sưa, rực rỡ”. Các từ này không có trong bài Bức tường có nhiều phép lạ, nên app dùng từ có trong bài.</i></li>
 <li><b>Câu 2:</b> viết 2–3 câu tả một cơn mưa có tính từ tả tiếng mưa (rào rào, tí tách, xối xả, lộp độp…). Mẫu: “Trời bỗng tối sầm lại rồi đổ một cơn mưa rào rào, xối xả. Những hạt mưa đập liên hồi vào mái tôn.”</li>
 <li><b>Viết · Hướng dẫn làm một đồ chơi:</b> bài có 2 phần: Chuẩn bị (dụng cụ, vật liệu) và Hướng dẫn thực hiện (các bước theo trình tự, mỗi bước có từ chỉ việc làm cụ thể). Mẫu của file hướng dẫn: chong chóng giấy 4 cánh (kẻ 2 đường chéo, cắt dừng cách tâm 1–2 cm, đục lỗ, gấp góc vào tâm, xâu ghim qua que).</li>
 <li><b>Nói và nghe · Kể chuyện Nhà phát minh và bà cụ:</b> 4 tranh: (1) Ê-đi-xơn phát minh đèn điện, bà cụ đi bộ gần 3 giờ đến xem; (2) bà cụ nghỉ ở ghế băng, nói mong có xe không cần ngựa kéo, chạy êm; (3) Ê-đi-xơn cùng cộng sự chế tạo xe điện; (4) mời bà cụ ngồi chiếc xe điện đầu tiên. Điều ấn tượng (mở): ông biết lắng nghe, sáng tạo, giữ lời hứa.</li></ul>
 <h3>Lỗi thường gặp (theo file hướng dẫn)</h3>
 <ul><li>Trả lời chỉ một ý khi câu hỏi có hai ý (hành động <u>và</u> suy nghĩ).</li><li>Hiểu bức tường thật sự có phép thuật: “phép lạ” là trí nhớ và trí tưởng tượng.</li>
 <li>Viết bài hướng dẫn quên phần dụng cụ, vật liệu hoặc không đánh số các bước.</li><li>Kể chuyện học thuộc lòng, giọng đều đều, bỏ quên lời ao ước của bà cụ.</li></ul>`;}

function parentB23(){return `<h3>Đáp án bài 23 · Bét-tô-ven và bản xô-nát Ánh trăng (theo văn bản SGK)</h3>
 <ul><li><b>Khởi động (mở):</b> kể tên bài hát thiếu nhi em thích và tác giả. Gợi ý của file hướng dẫn: Cho con (Phạm Trọng Cầu), Em yêu trường em (Hoàng Vân), Cánh én tuổi thơ (Phạm Tuyên), Đi học (Bùi Đình Thảo).</li>
 <li><b>Câu 1:</b> Bét-tô-ven là nhà soạn nhạc cổ điển vĩ đại trên thế giới, đã sáng tác nhiều bản nhạc nổi tiếng, trong đó có bản xô-nát Ánh trăng.<br><i>⚠ File hướng dẫn ghi “người Đức, sống ở Viên nước Áo”. Bài đọc không nói Bét-tô-ven là người nước nào; Viên chỉ là nơi có cây cầu bắc qua sông Đa-nuýp. Theo phần Từ ngữ, Viên là thủ đô của nước Áo.</i></li>
 <li><b>Câu 2:</b> gặp vào một đêm trăng sáng: ông nghe tiếng dương cầm văng vẳng, tiếng đàn đưa ông đến ngôi nhà trong khu lao động, thấy người cha chăm chú nghe con gái mù chơi đàn. Ước mơ duy nhất của cô gái: được ngắm nhìn ánh trăng trên dòng Đa-nuýp.<br><i>⚠ File hướng dẫn viết “ngôi nhà nhỏ nghèo nàn”. Bài đọc viết “ngôi nhà trong khu lao động”.</i></li>
 <li><b>Câu 3:</b> ông đến bên cây đàn, ngồi xuống và chơi một bản nhạc ngẫu hứng tràn đầy cảm xúc yêu thương.</li>
 <li><b>Câu 4:</b> các câu miêu tả: “Những nốt nhạc ngẫu hứng vang lên, … lúc êm ái, nhẹ nhàng như ánh trăng, lúc lại mạnh mẽ như sóng sông Đa-nuýp.” · “Trong tâm trí của hai cha con, … chỉ còn một thế giới huyền ảo, lung linh, tràn ngập ánh trăng.” · “Cô gái mù có cảm giác mình đang được ngắm nhìn, đùa giỡn với ánh trăng trên dòng sông Đa-nuýp.”</li>
 <li><b>Câu 5:</b> bản nhạc ra đời trong đêm trăng bên sông; giai điệu giúp cô gái mù cảm nhận vẻ đẹp của ánh trăng, nên có tên Ánh trăng.</li>
 <li><b>Luyện từ và câu 1:</b> tính từ tả tiếng nhạc: da diết, êm ái, nhẹ nhàng, mạnh mẽ, ngẫu hứng. Tính từ tả dòng sông: xinh đẹp, lấp lánh.<br><i>⚠ File hướng dẫn nêu thêm “rộn rã, êm đềm, phẳng lặng”. Các từ này không có trong bài đọc, nên app dùng từ có trong bài.</i></li>
 <li><b>Câu 2 (thành ngữ):</b> hiền như bụt, đen như than, đỏ như gấc, xấu như ma, trắng như tuyết, đẹp như tiên.</li>
 <li><b>Câu 3 (đoạn thơ “Em về làng xóm” của Định Hải):</b> xanh tả tre, lúa; xanh mát tả dòng sông máng; xanh ngắt tả trời mây mùa thu. Rồi viết 2–3 câu có dùng các tính từ đó. Mẫu: “Bầu trời mùa thu trong vắt và xanh ngắt một màu.”</li>
 <li><b>Viết · Tìm hiểu cách viết đơn:</b> mục đích: xin tham gia Câu lạc bộ Sáng tạo; người viết Vũ Nam Hải (lớp 4C); nơi nhận Ban Giám hiệu Trường Tiểu học Trung Hoà. Bố cục: Quốc hiệu, tiêu ngữ → Tên đơn → Kính gửi → Giới thiệu bản thân → Lí do, nguyện vọng → Lời hứa, lời cảm ơn → Địa điểm, ngày tháng, chữ kí, họ tên; bên trái cuối đơn: ý kiến phụ huynh.</li>
 <li><b>Vận dụng:</b> bố mẹ và con trao đổi tình huống cần viết đơn: xin nghỉ học, xin cấp lại thẻ thư viện, đăng kí ăn bán trú…</li></ul>
 <h3>Lỗi thường gặp (theo file hướng dẫn)</h3>
 <ul><li>Trả lời ước mơ của cô gái mù là “được sáng mắt”. Đúng theo bài: được ngắm nhìn ánh trăng trên sông Đa-nuýp.</li>
 <li>Viết sai tên riêng nước ngoài: viết hoa chữ đầu và dùng dấu gạch nối (Bét-tô-ven, Đa-nuýp).</li>
 <li>Điền sai thành ngữ (đỏ như tuyết, trắng như than…).</li>
 <li>Viết đơn quên Quốc hiệu, tiêu ngữ, quên “Kính gửi”, quên lời hứa và lời cảm ơn, đặt sai vị trí chữ kí.</li></ul>`;}

function parentB24(){return `<h3>Đáp án bài 24 · Người tìm đường lên các vì sao (theo văn bản SGK)</h3>
 <ul><li><b>Khởi động (mở):</b> kể tên một nhà khoa học và điều em biết (Ê-đi-xơn: bóng đèn điện, máy ghi âm; Niu-tơn: định luật vạn vật hấp dẫn; Xi-ôn-cốp-xki: nền móng ngành du hành vũ trụ).</li>
 <li><b>Câu 1:</b> từ nhỏ ông mơ ước được bay; dại dột nhảy qua cửa sổ để bay theo những cánh chim, bị ngã gãy chân; rủi ro làm nảy ra câu hỏi “Vì sao quả bóng không có cánh mà vẫn bay được?”; ông đọc không biết bao nhiêu sách và làm thí nghiệm.<br><i>⚠ File hướng dẫn thêm ý “tại sao con người lại không bay được như chim”. Câu hỏi này không có trong bài đọc; chỉ có câu hỏi về quả bóng.</i></li>
 <li><b>Câu 2:</b> đọc rất nhiều sách; làm thí nghiệm có khi hàng trăm lần; quanh năm chỉ ăn bánh mì suông để dành tiền mua sách và dụng cụ; Sa hoàng không ủng hộ nhưng ông không nản chí, tiếp tục nghiên cứu lí thuyết bay; hơn bốn mươi năm khổ công nghiên cứu.</li>
 <li><b>Câu 3:</b> tìm ra cách chế tạo khí cầu bay bằng kim loại; đề xuất mô hình tên lửa nhiều tầng thành phương tiện bay tới các vì sao.</li>
 <li><b>Câu 4:</b> nhan đề ca ngợi Xi-ôn-cốp-xki, người nghiên cứu và mở đường để con người bay lên vũ trụ.<br><i>⚠ File hướng dẫn viết “người đầu tiên trên thế giới”. Bài đọc không nói vậy; con chỉ cần nói ông là người tìm đường, mở đường cho việc bay vào vũ trụ.</i></li>
 <li><b>Câu 5 (mở):</b> nếu là nhà khoa học, em muốn sáng chế gì và vì sao (ví dụ: máy tái chế rác để Trái Đất sạch hơn).</li>
 <li><b>Luyện tập 1:</b> tính từ nêu phẩm chất nhà khoa học: miệt mài, thông thái (mẫu), kiên trì, nhẫn nại, bền bỉ, say mê, sáng tạo, tỉ mỉ, cần cù… <b>Câu 2:</b> 2–3 câu giới thiệu nhà khoa học hoặc phát minh.</li>
 <li><b>Viết · Viết đơn:</b> chọn 1 trong 2 đề: xin tham gia câu lạc bộ em yêu thích, hoặc xin nghỉ một buổi học. Theo mẫu bài 23: quốc hiệu, tiêu ngữ; tên đơn; Kính gửi; giới thiệu bản thân; lí do; lời hứa; lời cảm ơn; địa điểm, ngày tháng; ý kiến phụ huynh; chữ kí, họ tên. Đọc soát: quốc hiệu, tiêu ngữ; tên đơn; nội dung đơn.</li>
 <li><b>Đọc mở rộng:</b> đọc truyện về nhà khoa học (Niu-tơn, Anh-xtanh, Quy-ri…) và viết phiếu đọc sách (tên câu chuyện, tác giả, ngày đọc, tên nhà khoa học, phát minh hoặc đóng góp, mức độ yêu thích).<br><i>⚠ Phiếu mẫu trong file hướng dẫn ghi tên tác giả là “Truyện kể danh nhân thế giới” và ngày đọc 20/11/2023. Đó chỉ là ví dụ; con tự ghi thông tin sách của mình.</i></li></ul>
 <h3>Lỗi thường gặp (theo file hướng dẫn)</h3>
 <ul><li>Viết sai tên riêng nước ngoài: Xi-ôn-cốp-xki, Ê-đi-xơn (có dấu gạch nối giữa các tiếng).</li>
 <li>Nhầm nguyên nhân gãy chân: do dại dột nhảy qua cửa sổ để bay, không phải do thí nghiệm.</li>

 <li>Nhầm tính từ phẩm chất với danh từ, động từ (thí nghiệm, nghiên cứu).</li>

function buildAudio(){AUDIO={};if(!L||!AUDIO_HAVE[L.id])return;
  for(const key of (AUDIO_CH[L.id]||[])){const [sid,k]=key.split('.');const S=SENTS[sid];if(S&&S.c[+k]!=null)AUDIO[clean(S.c[+k])]=`audio/${L.id}/${key}.mp3`;}
  for(const id of Object.keys(SENTS)){AUDIO[clean(SENTS[id].c.join(' '))]=`audio/${L.id}/${id}.mp3`;}}
// iPad/iPhone chỉ cho phát tiếng khi phần tử audio đã được "mở khoá" bằng một lần chạm. Dùng MỘT phần tử audio cho mọi đoạn.
const AEL=new Audio();AEL.preload='auto';
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
let aUnlocked=false;
function unlockAudio(){if(aUnlocked)return;aUnlocked=true;try{AEL.src=SILENT;const p=AEL.play();if(p&&p.catch)p.catch(()=>{aUnlocked=false;});}catch(e){aUnlocked=false;}}
['pointerdown','touchstart','touchend','click'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true,capture:true}));
function stopAudio(){if(AUD.cur){AUD.cur=null;try{AEL.onended=AEL.onerror=AEL.onplaying=null;AEL.pause();}catch(e){}}}
function playClip(url,rate){
  return new Promise(res=>{
    let done=false,tm;const tok={};
    const fin=ok=>{if(!done){done=true;clearTimeout(tm);if(AUD.cur===tok)AUD.cur=null;AEL.onended=AEL.onerror=AEL.onplaying=null;res(ok);}};
    AUD.cur=tok;
    try{AEL.onended=AEL.onerror=AEL.onplaying=null;AEL.pause();AEL.src=url;AEL.preservesPitch=true;AEL.webkitPreservesPitch=true;AEL.playbackRate=Math.max(.75,Math.min(1.05,(rate||.95)/.95));}catch(e){}
    AEL.onended=()=>fin(true);
    AEL.onerror=()=>{AUD.bad[url]=1;try{toast('Không tải được file '+url+'. Máy sẽ dùng giọng máy');}catch(e){}fin(false);};
    tm=setTimeout(()=>{try{AEL.pause();}catch(e){}fin(false);},4000);
    AEL.onplaying=()=>{clearTimeout(tm);tm=setTimeout(()=>{try{AEL.pause();}catch(e){}fin(true);},((AEL.duration||30)/AEL.playbackRate+1.5)*1000);};
    try{AEL.load();}catch(e){}
    const p=AEL.play();if(p&&p.catch)p.catch(err=>{if(!err||err.name!=='NotAllowedError')AUD.bad[url]=1;fin(false);});
  });
}

 <li><b>Luyện từ và câu 1 (nhân hoá):</b> câu (c) về chim: chích choè gọi “thím”, tả “nhanh nhảu”; khướu gọi “chú”, tả “lắm điều”; chào mào gọi “anh”, tả “đỏm dáng”; cu gáy gọi “bác”, tả “trầm ngâm”. Hai cách: gọi bằng từ chỉ người; tả bằng việc làm, tính nết của người.<br><i>⚠ File hướng dẫn trả lời phần (a), (b) cho đoạn “nước, bò, bão”, nhưng trong sách (a) là bài thơ chim mừng, cào cào, gió (Quang Khải), (b) là cậu bé nói chuyện với cái cây. Chỉ phần (c) trùng nhau. Bố mẹ đối chiếu theo sách nhé: (a) chim, cào cào, hạt, “chị gió” được nhân hoá; (b) cây được cậu bé trò chuyện như người, “im lặng nhìn em”.</i></li>

 <li><b>Câu 3:</b> đặt 2–3 câu nhân hoá. Mẫu: “Những chị mây đang dạo chơi trên bầu trời.”</li></ul>

  GL_KEYS=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);

}

const TTS={voice:null,token:0,n:0,vi:[],started:false,err:'',warned:false,has:('speechSynthesis' in window)};
function loadVoices(){if(!TTS.has)return;const vs=speechSynthesis.getVoices();TTS.n=vs.length;TTS.vi=vs.filter(v=>v.lang&&/^vi/i.test(v.lang));TTS.voice=TTS.vi[0]||null;}
if(TTS.has){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}let n=0;const iv=setInterval(()=>{loadVoices();if(TTS.n>0||++n>20)clearInterval(iv);},400);}
function clean(t){return t.replace(/[–—]/g,' ').replace(/(\p{L})-(?=\p{L})/gu,'$1 ').replace(/\s+/g,' ').trim();}
function speakOnce(text,rate,pitch,modeOv){
  const au=AUDIO[clean(text)];
  if(au&&!AUD.bad[au])return playClip(au,rate).then(ok=>ok?undefined:speakOnce2(text,rate,pitch,modeOv));
  return speakOnce2(text,rate,pitch,modeOv);
}
function speakOnce2(text,rate,pitch,modeOv){
  return new Promise(res=>{
    if(!TTS.has)return res();
    let done=false,tm;const fin=()=>{if(!done){done=true;clearTimeout(tm);res();}};
    try{
      const mode=modeOv!=null?modeOv:(S.ttsMode||0);
      const u=new SpeechSynthesisUtterance(clean(text));u.lang=mode===2?'vi':'vi-VN';if(mode===0&&TTS.voice)u.voice=TTS.voice;
      u.rate=rate||S.rate;u.pitch=pitch||1.05;
      u.onstart=()=>{TTS.started=true;};u.onend=()=>{TTS.ended=true;fin();};
      u.onerror=ev=>{TTS.err=(ev&&ev.error)||'error';if(!TTS.warned&&/language|synthesis|not-allowed/.test(TTS.err)){TTS.warned=true;try{toast('Máy chưa phát được tiếng. Bấm 🔊 Thử âm thanh ở trang chính nhé');}catch(e){}}fin();};
      (TTS.keep=TTS.keep||[]).push(u);if(TTS.keep.length>6)TTS.keep.shift();
      tm=setTimeout(fin,4000+text.length*220/(rate||1));
      try{speechSynthesis.resume();}catch(e){}
      speechSynthesis.speak(u);
    }catch(e){fin();}
  });
}
function stopSpeech(){TTS.token++;stopAudio();try{TTS.has&&speechSynthesis.cancel();}catch(e){} setTalk(false);}
async function speakSeq(items,o={}){
  const tk=++TTS.token;stopAudio();try{TTS.has&&speechSynthesis.cancel();}catch(e){}
  await sleep(90);
  for(let i=0;i<items.length;i++){
    if(tk!==TTS.token)return false;
    const it=typeof items[i]==='string'?{t:items[i]}:items[i];
    if(o.onItem)o.onItem(i,it);
    await speakOnce(it.t,it.rate||o.rate,o.pitch);
    if(tk!==TTS.token)return false;
    const gap=it.after!=null?it.after:(o.gap!=null?o.gap:300);
    if(o.onAfter)o.onAfter(i,it,gap);
    await sleep(gap);
  }
  return tk===TTS.token;
}

function withGloss(text){return esc(text).replace(GL_RE,m=>`<span class="gl" data-k="${m.toLowerCase()}">${m}</span>`);}
function bindGloss(root){$$('.gl',root).forEach(g=>g.addEventListener('click',e=>{e.stopPropagation();openGloss(g.dataset.k);}));}
function openGloss(k){
  const d=GLOSS[k];if(!d)return;stopSpeech();
  const sh=$('#sheet');sh.innerHTML=`<div class="e">${d.e}</div><div class="w">${esc(k)}</div><p>${esc(d.d)}</p><p>💡 <i>${esc(d.x)}</i></p>
    <div class="row"><button class="btn blue" id="gHear">🔊 Nghe</button><button class="btn alt" id="gClose">Đóng</button></div>`;
  sh.classList.add('show');window.__sheetAt=Date.now();
  const play=()=>{setTalk(true);speakSeq([{t:k,rate:.75,after:500},{t:d.d,rate:.85,after:400},{t:d.x,rate:.85}]).then(()=>setTalk(false));};
  $('#gHear').onclick=play;$('#gClose').onclick=closeSheet;play();
}
function closeSheet(){const s=$('#sheet');if(s)s.classList.remove('show');}

// ===== Bước 2: nghe truyện =====
let slowListen=true;
function stepListen(pi){
  shell('2 · Nghe truyện',1);
  const pg=PAGES[pi];
  const html=pg.ids.map(id=>{const s=SENTS[id];return `<span class="sent ${s.d?'d':''}" data-id="${id}">${s.c.map(c=>`<span class="ck">${withGloss(c)}</span>`).join('')}</span> `;}).join('');
  main(`<div class="card"><div class="scene">${pg.scene}</div><div class="read" id="rd">${html}</div>
    <p class="legend">Chạm vào chữ có gạch cam 🟠 để biết nghĩa nhé · Trang ${pi+1}/${PAGES.length}</p></div>
    <div class="row"><button class="btn alt" id="prev" ${pi===0?'disabled':''}>⬅️ Trước</button>
    <button class="btn" id="play">▶ Nghe Miu-Bot đọc</button>
    <button class="btn alt" id="spd">${slowListen?'🐢 Chậm':'🐇 Vừa'}</button>
    <button class="btn ${pi===PAGES.length-1?'sun':'alt'}" id="next">${pi===PAGES.length-1?'Xong, đọc cùng nhé ➡️':'Sau ➡️'}</button></div>`);
  bindGloss($('#rd'));
  say(pi===0?`${nm()} ơi, bấm nút Nghe để Miu-Bot đọc truyện nhé. Bạn nhìn chữ sáng lên theo giọng đọc!`:'Mình nghe tiếp nhé!','happy',{mute:pi!==0});
  const play=$('#play');let playing=false;
  async function run(){
    if(playing){stopSpeech();playing=false;play.textContent='▶ Nghe Miu-Bot đọc';$$('.sent').forEach(x=>x.classList.remove('on'));return;}
    playing=true;play.textContent='⏸ Dừng';setMood('happy');setTalk(true);
    const ok=await speakSeq(pg.ids.map(id=>({t:SENTS[id].c.join(' ')})),{rate:slowListen?0.78:0.95,gap:500,
      onItem:i=>{$$('.sent').forEach(x=>x.classList.remove('on'));const el=$(`.sent[data-id="${pg.ids[i]}"]`);if(el){el.classList.add('on');el.scrollIntoView({block:'nearest',behavior:'smooth'});}}});
    setTalk(false);
    if(ok){playing=false;play.textContent='🔁 Nghe lại';$$('.sent').forEach(x=>x.classList.remove('on'));$('#next').classList.add('pulse');}
  }
  play.onclick=run;
  $('#spd').onclick=()=>{slowListen=!slowListen;$('#spd').textContent=slowListen?'🐢 Chậm':'🐇 Vừa';};
  $('#prev').onclick=()=>{stopSpeech();stepListen(pi-1);};
  $('#next').onclick=()=>{stopSpeech();if(pi<PAGES.length-1)stepListen(pi+1);else{addStar(1,'nghe xong truyện');stepDone('listen');stepPractice(0);}};
}

  $('#b2').onclick=async()=>{clear();setMood('cheer');

  $('#b3').onclick=()=>{stopSpeech();clear();setMood('think');setTalk(false);

    $('#again').onclick=()=>{S.retries++;save();toast('Mình đọc lại nhé!');};

const TONE_LEGEND='không dấu ➖ · sắc ↗ · huyền ↘ · hỏi ⤵ · ngã 〰️ · nặng ⬇';
function stepTone(i){
  shell('4 · Nghe dấu',3);
  const it=TONES[i];const target=pick(it.opts);
  main(`<div class="dots">${TONES.map((_,k)=>`<i class="${k<i?'on':''} ${k===i?'cur':''}"></i>`).join('')}</div>
    <div class="card"><h2>Miu-Bot đọc từ nào?</h2><p class="sub">Nghe thật kĩ rồi chạm vào từ đúng nhé.</p>
    <div class="row"><button class="btn blue" id="hear">🔊 Nghe từ</button></div>
    <div class="opts">${shuffle(it.opts).map(o=>`<button class="opt" data-w="${o.w}"><span class="em">${o.e}</span>${o.w}<small id="t_${o.w}"></small></button>`).join('')}</div>
    <p class="legend">Dấu thanh: ${TONE_LEGEND}</p></div>`);
  const play=async()=>{setTalk(true);await speakSeq([{t:target.w,rate:.7,after:700},{t:target.w,rate:.7}]);setTalk(false);};
  say(i===0?'Cùng chơi trò nghe dấu nhé! Mình đọc một từ, bạn chọn từ đúng.':'Từ tiếp theo nè!','happy',{mute:i!==0});
  $('#hear').onclick=play;setTimeout(play,i===0?3800:300);
  let tried=0,solved=false;
  $$('.opt').forEach(b=>b.onclick=async()=>{
    if(solved)return;
    if(b.dataset.w===target.w){
      solved=true;b.classList.add('ok');
      it.opts.forEach(o=>{$('#t_'+o.w).textContent=o.t+' · '+o.m;});
      addStar(1);setMood('cheer');setTalk(true);
      await speakSeq([{t:praise(),after:200},...it.opts.map(o=>({t:o.w,rate:.7,after:500}))],{});setTalk(false);
      if(i<TONES.length-1){setTimeout(()=>stepTone(i+1),400);}else{stepDone('tone');say('Tai của bạn thính quá! Mình sang trò chơi nhé!','cheer');setTimeout(()=>stepSort(),1800);}
    }else{
      tried++;b.classList.add('soft');S.misses[target.w]=(S.misses[target.w]||0)+1;save();
      say(retryMsg()+' Nghe lại nhé.','think');
      await sleep(900);play();setTimeout(()=>b.classList.remove('soft'),1500);
    }
  });
}

  });

// ===== Bước 6: xếp truyện, kể lại, nhận quà =====
function stepOrderGame(O){
  O=Object.assign({idx:5,title:'6 · Xếp truyện',h:'Xếp lại câu chuyện',sub:'Chạm các thẻ theo thứ tự: chuyện gì xảy ra trước, rồi sau.',say:'Bạn nhớ chuyện gì xảy ra đầu tiên? Chạm vào thẻ đó trước nhé!',star:2,starWhy:'xếp đúng truyện',win:'Đúng cả rồi! Bây giờ bạn kể lại câu chuyện cho mình nghe nhé!',id:null,after:()=>stepRetell(),retry:'Gần rồi! Thử nghĩ xem chuyện gì xảy ra trước nhé.'},O);
  shell(O.title,O.idx);
  const N=O.cards.length;const cards=shuffle(O.cards.map((t,k)=>({t,k})));let next=0;
  main(`<div class="card"><h2>${esc(O.h)}</h2><p class="sub">${esc(O.sub)}</p>
    <div class="order">${cards.map(c=>`<button class="ocard" data-k="${c.k}">${esc(c.t)}<span class="no"></span></button>`).join('')}</div></div>`);
  say(O.say);
  $$('.ocard').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('ok'))return;
    if(+b.dataset.k===next){b.classList.add('ok');$('.no',b).textContent=next+1;next++;ding();
      if(next===N){addStar(O.star,O.starWhy);if(O.id)stepDone(O.id);say(O.win,'cheer');setTimeout(O.after,2800);}}
    else{b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),450);say(O.retry,'think');}
  });
}
function stepSequence(){stepOrderGame({cards:STORY_ORDER});}
function stepRetell(){
  shell('6 · Nói về bài',5);const R=L.RETELL;
  main(`<div class="card"><h2>Bạn nói cho Miu-Bot nghe nhé</h2>
    <p class="q">${esc(R.q)}</p>
    <p class="sub">${esc(R.sub)}</p>
    <div class="row"><button class="btn sun" id="told">✔ Mình nói xong rồi!</button></div></div>`);
  say(R.say,'happy');
  $('#told').onclick=()=>{addStar(2,'đã kể lại');DN().retell=true;save();reward();};
}
function reward(){
  shell('Hoàn thành!',-1);const B=L.BADGE;
  const total=S.stars-(startStars==null?S.stars:startStars);
  main(`<div class="card" style="text-align:center"><div class="big">${B.e}</div><h2>Huy hiệu “${esc(B.name)}”</h2>

function stepRole(){
  shell('1 · Đóng vai cây hoa',0);

  $$('[data-r]').forEach(b=>b.onclick=()=>roleBuild(b.dataset.r));

function roleBuild(rk){
  const R=ROLES[rk];let emo=-1,act=-1;
  main(`<div class="card"><h2>${R.e} Đặt câu nêu cảm xúc của ${R.n}</h2>
    <p class="sub">Chọn một cảm xúc và một việc để ghép thành câu.</p>
    <div class="field"><label>1. Cây cảm thấy thế nào?</label><div class="chips" id="ce">${EMO.map((e,i)=>`<button class="chip" data-i="${i}">${e}</button>`).join('')}</div></div>
    <div class="field"><label>2. Vì cây đang làm gì?</label><div class="chips" id="ca">${R.acts.map((a,i)=>`<button class="chip" data-i="${i}">${a.seg.join(' ')}</button>`).join('')}</div></div>
    <div class="q" id="pre" style="min-height:70px;background:#fff7d6;border-radius:18px;padding:12px 16px">…</div>
    <div class="row"><button class="btn blue" id="rd" disabled>🔊 Nghe câu</button><button class="btn sun" id="nx" disabled>Tìm động từ ➡️</button></div></div>`);
  say('Bạn xưng “tôi” như cây hoa đang tự nói nhé!','happy');
  const sentence=()=>`Tôi cảm thấy ${EMO[emo]} khi mình ${R.acts[act].seg.join(' ')}.`;
  const upd=()=>{const ok=emo>=0&&act>=0;$('#pre').textContent=ok?sentence():'…';$('#rd').disabled=!ok;$('#nx').disabled=!ok;};
  $$('#ce .chip').forEach(b=>b.onclick=()=>{$$('#ce .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');emo=+b.dataset.i;upd();});
  $$('#ca .chip').forEach(b=>b.onclick=()=>{$$('#ca .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');act=+b.dataset.i;upd();});
  $('#rd').onclick=()=>{setTalk(true);speakSeq([{t:sentence(),rate:.85}]).then(()=>setTalk(false));};
  $('#nx').onclick=()=>roleVerbs(R,EMO[emo],R.acts[act]);
}
function roleVerbs(R,emo,a){
  const segs=['Tôi','cảm thấy',emo,'khi','mình',a.seg[0],a.seg[1]+'.'];
  const need={'cảm thấy':0,[a.seg[0]]:0};let got=0;
  main(`<div class="card"><h2>Tìm động từ trong câu</h2><p class="sub">Động từ chỉ việc làm hay hoạt động. Chạm vào các động từ trong câu của bạn nhé!</p>
    <div class="segs">${segs.map((s,i)=>`<button class="seg" data-i="${i}">${esc(s)}</button>`).join('')}</div>
    <p class="legend">Mẹo: hỏi “làm gì?” hoặc “cảm thấy thế nào?”</p><div class="row" id="nxr"></div></div>`);
  say('Bây giờ bạn là thám tử tìm động từ! Câu của bạn có hai động từ chính. Bạn tìm thử nhé!','think');
  $$('.seg').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('ok'))return;const w=b.textContent.replace('.','');
    if(w in need){b.classList.add('ok');need[w]=1;got++;ding();
      if(got===2){addStar(2,'tìm đúng động từ');stepDone('w1');say(`Giỏi quá! “Cảm thấy” và “${a.seg[0]}” là động từ. Bạn xưng tôi nghe rất giống ${R.n}!`,'cheer');$('#nxr').innerHTML=`<button class="btn sun pulse" id="g">Sang bước 2 ➡️</button>`;$('#g').onclick=()=>stepMap();}
      else say(praise()+' Còn một động từ nữa nhé.','cheer');}
    else if(w===emo){b.classList.add('ok');say(`“${w}” chỉ cảm xúc. Sách hướng dẫn cũng tính là động từ chỉ trạng thái. Bạn tìm thêm từ chỉ việc làm nhé!`,'happy');}
    else{b.classList.add('soft');setTimeout(()=>b.classList.remove('soft'),700);say(w==='Tôi'||w==='mình'?`“${w}” là từ chỉ người, không phải việc làm. Thử từ khác nhé!`:`Từ này chưa phải việc làm. Thử hỏi “làm gì?” nhé!`,'think');}
  });
}

const OL_STEPS=['Mở bài','Thân bài','Kết bài'];
function olHeader(part){return `<div class="dots">${OL_STEPS.map((_,k)=>`<i class="${k<part?'on':''} ${k===part?'cur':''}"></i>`).join('')}</div>`;}

      $$('[data-md]').forEach(b=>b.classList.toggle('alt',+b.dataset.md!==o.mode));

        <div class="field"><label>Ở đâu? Cùng ai?</label><input class="tin" data-k="place" placeholder="Ví dụ: ở làng gốm Bát Tràng, cùng cả lớp"></div>`
       :`<div class="field"><label>Tên hoạt động</label><input class="tin" data-k="name"></div>
        <div class="field"><label>Vì sao em muốn tham gia?</label><input class="tin" data-k="reason" placeholder="Ví dụ: vì em rất thích tự tay làm đồ vật"><div class="chips" id="rc">${['Vì em rất thích','Vì em muốn biết thêm','Vì em muốn thử sức'].map(x=>`<button class="chip">${x}</button>`).join('')}</div></div>`;
      bindInputs($('#fm'),chk);
      $$('#tc .chip').forEach(c=>c.onclick=()=>{o.time=c.textContent;save();draw();});
      $$('#rc .chip').forEach(c=>c.onclick=()=>{o.reason=(c.textContent+' ').trimStart();save();draw();$('[data-k=reason]').focus();});
      chk();};
    function chk(){const ok=o.name.trim()&&(o.mode===1?(o.time.trim()||o.place.trim()):o.reason.trim());$('#nx').disabled=!ok;}
    $$('[data-md]').forEach(b=>b.onclick=()=>{o.mode=+b.dataset.md;save();draw();});
    draw();$('#nx').onclick=()=>{addStar(1,'xong mở bài');stepOutline(1);};
  }
  if(part===1){
    const ft=filledTasks(),ords=ordFor(ft.length);
    main(olHeader(1)+`<div class="card"><h2>🛤️ Thân bài: kể các việc theo thứ tự</h2>
      <p class="sub">Với mỗi việc, ghi thêm chi tiết: ở đâu, bao lâu, cùng ai. Chạm ⭐ ở việc em thấy ấn tượng nhất.</p>
      ${ft.map((x,k)=>`<div class="field"><label><span class="ord">${ords[k]}</span>, ${esc(x.t)}</label><div class="trow"><input class="tin" data-k="detail.${x.i}" placeholder="Ở đâu? Bao lâu? Cùng ai?"><button class="starbtn ${o.star===x.i?'on':''}" data-st="${x.i}" aria-label="Ấn tượng nhất">⭐</button></div></div>`).join('')}
      <div class="field" id="whyf" style="display:${o.star>=0?'block':'none'}"><label>Vì sao việc đó ấn tượng nhất?</label><input class="tin" data-k="why" placeholder="Ví dụ: vì em tự làm được một chiếc cốc"></div>
      <div class="row"><button class="btn alt" id="bk">⬅️ Mở bài</button><button class="btn sun" id="nx">Sang kết bài ➡️</button></div></div>`);
    say('Thân bài là con đường. Bạn thêm chi tiết cho từng việc. Nhớ chạm ngôi sao ở việc bạn thích nhất nhé!');
    bindInputs($('.card'));
    $$('.starbtn').forEach(b=>b.onclick=()=>{o.star=+b.dataset.st;save();$$('.starbtn').forEach(x=>x.classList.toggle('on',x===b));$('#whyf').style.display='block';});

      <div class="field"><label>Kết quả của hoạt động (em được gì, hiểu thêm gì?)</label><input class="tin" data-k="result" placeholder="Ví dụ: em hiểu thêm nghề làm gốm rất vất vả"><div class="chips" id="rc">${['Em hiểu thêm về','Em làm được','Em có thêm một món quà:'].map(x=>`<button class="chip">${x}</button>`).join('')}</div></div>
      <div class="field"><label>Em cảm thấy thế nào? (chọn nhiều cũng được)</label><div class="chips" id="fc">${['😄 thích thú','🏅 tự hào','🤩 háo hức','🥰 yêu thích','🙏 biết ơn'].map(x=>`<button class="chip ${o.feels.includes(x.slice(3))?'on':''}" data-f="${x.slice(3)}">${x}</button>`).join('')}</div>

    const chk=()=>{$('#nx').disabled=!(o.result.trim()&&(o.feels.length||o.feelText.trim()));};
    bindInputs($('.card'),chk);

    $$('#rc .chip').forEach(c=>c.onclick=()=>{o.result=c.textContent+' ';save();$('[data-k=result]').value=o.result;$('[data-k=result]').focus();chk();});
    $('#bk').onclick=()=>stepOutline(1);chk();
    $('#nx').onclick=()=>{addStar(1,'xong kết bài');stepDone('w4');stepCheck();};
  }
}

// ---------- Bước 5: kiểm tra dàn ý theo 3 tiêu chí (tr.47) ----------
function outlineParts(){
  const o=OL(),ft=filledTasks(),ords=ordFor(ft.length);
  const m=o.mode===1?[`Hoạt động: ${o.name}`,o.time&&`Thời gian: ${o.time}`,o.place&&`Địa điểm, người cùng tham gia: ${o.place}`]:[`Hoạt động: ${o.name}`,o.reason&&`Lí do em muốn tham gia: ${o.reason}`];
  const t=ft.map((x,k)=>`${ords[k]}: ${x.t}${o.detail[x.i]&&o.detail[x.i].trim()?' ('+o.detail[x.i].trim()+')':''}${o.star===x.i?' ⭐ ấn tượng nhất'+(o.why.trim()?' vì '+o.why.trim().replace(/^vì\s+/i,''):''):''}`);
  const k=[o.result.trim()&&`Kết quả: ${o.result.trim()}`,(o.feels.length||o.feelText.trim())&&`Cảm xúc: ${[...o.feels,o.feelText.trim()].filter(Boolean).join(', ')}`];
  return {m:m.filter(Boolean),t,k:k.filter(Boolean)};
}
const outlineText=()=>{const p=outlineParts();return `DÀN Ý: ${OL().name}\nMở bài\n- ${p.m.join('\n- ')}\nThân bài\n- ${p.t.join('\n- ')}\nKết bài\n- ${p.k.join('\n- ')}`;};
function stepCheck(){
  shell('5 · Kiểm tra dàn ý',4);
  const o=OL(),p=outlineParts();
  const crit=[{ok:filledTasks().length>=3,t:'Các việc được xếp theo thứ tự hợp lí',fix:'Thêm việc',go:()=>stepPrep()},
              {ok:!!o.result.trim(),t:'Nêu rõ kết quả của hoạt động',fix:'Thêm kết quả',go:()=>stepOutline(2)},
              {ok:!!(o.feels.length||o.feelText.trim()),t:'Thể hiện suy nghĩ, cảm xúc của em',fix:'Thêm cảm xúc',go:()=>stepOutline(2)}];
  const all=crit.every(c=>c.ok);
  const box=(c,h,l)=>`<div class="ol ${c}"><h4>${h}</h4>${l.map(x=>`<div>• ${ordHtml(x)}</div>`).join('')}</div>`;
  main(`<div class="card"><h2>Dàn ý của ${esc(nm())}</h2>${box('m','🚪 Mở bài',p.m)}${box('t','🛤️ Thân bài',p.t)}${box('k','🏆 Kết bài',p.k)}
    <div class="row"><button class="btn blue" id="rd">🔊 Miu-Bot đọc dàn ý</button><button class="btn alt" id="cp">📋 Sao chép</button></div></div>
    <div class="card"><h2>Kiểm tra 3 điều</h2>${crit.map((c,i)=>`<div class="chk ${c.ok?'ok':''}"><span>${c.ok?'✅':'⬜'}</span>${c.t}${c.ok?'':`<button class="btn alt b" data-c="${i}" style="min-height:48px;font-size:18px">${c.fix}</button>`}</div>`).join('')}
    <div class="row"><button class="btn sun ${all?'pulse':''}" id="fin" ${all?'':'disabled'}>🎉 Hoàn thành!</button></div></div>`);
  say(all?'Dàn ý của bạn đủ cả ba điều rồi! Bạn đọc lại thử nhé, hoặc nhờ Miu-Bot đọc cho nghe.':'Mình kiểm tra dàn ý nhé. Còn thiếu một điều, bạn bổ sung giúp mình nhé!','happy');
  $$('[data-c]').forEach(b=>b.onclick=()=>crit[+b.dataset.c].go());
  $('#rd').onclick=()=>{setTalk(true);const L=[`Dàn ý: ${o.name}`,'Mở bài',...p.m,'Thân bài',...p.t,'Kết bài',...p.k];speakSeq(L.map(t=>({t:t.replace('⭐',''),after:350})),{rate:.85}).then(()=>setTalk(false));};
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(outlineText());toast('Đã sao chép dàn ý');}catch(e){const el=document.createElement('textarea');el.className='tin';el.rows=10;el.value=outlineText();$('#cp').parentNode.after(el);el.select();toast('Chọn rồi sao chép nhé');}};
  $('#fin').onclick=()=>{addStar(3,'hoàn thành dàn ý');stepDone('w5');reward2();};
}

const BUILD=[
 {e:'☁️',n:'Những chị mây',acts:['đang dạo chơi trên bầu trời','thong thả trôi trên nền trời xanh thẳm','tụ họp rồi thì thầm với nhau']},
 {e:'🍃',n:'Chị gió',acts:['tinh nghịch đuổi bắt những chiếc lá vàng','cất tiếng hát trong trẻo đón bình minh','vỗ về từng nhành cây']},
 {e:'☀️',n:'Cô nắng',acts:['thức dậy, vội vàng nhảy nhót trên vòm lá','khẽ chạm vào má em ấm áp','mỉm cười chào đón ngày mới']},
 {e:'🌧️',n:'Bác mưa rào',acts:['cất tiếng hát rào rào trên mái nhà','ghé thăm, tưới mát cho cây cối','vội vã chạy qua sân trường']},
 {e:'🌪️',n:'Thần bão',acts:['giận dữ gầm thét','xô đẩy cây cối ngả nghiêng','mệt rồi, lặng lẽ bỏ đi']}
];
const BUILD_FREE={
 b19:{key:'b19',title:'Em đặt câu nhân hoá',prompt:'Đặt thêm 1 hoặc 2 câu có hình ảnh nhân hoá nói về cảnh vật, hiện tượng thiên nhiên theo ý của em.',starters:['Những chú chim','Hàng cây','Mặt trời','Dòng suối'],ph:'Ví dụ: Hàng cây bên đường thì thầm trò chuyện cùng cơn mưa.'},
 b20:{key:'b20',title:'Em tả bầu trời',prompt:'Viết 1 hoặc 2 câu tả bầu trời theo quan sát và cảm nhận của em. Em nhìn ra cửa sổ hoặc nhớ lại bầu trời hôm nay nhé! Có thể dùng từ như người: dịu dàng, buồn bã, trầm ngâm…',starters:['Bầu trời hôm nay','Những đám mây','Bầu trời buổi sáng'],ph:'Ví dụ: Bầu trời buổi sáng trong vắt như một tấm gương khổng lồ.'}
};
function stepBuild(idx,A){
  A=A||{};const F=BUILD_FREE[L.id];
  shell('1 · Đặt câu nhân hoá',idx);
  let si=-1,ai=-1;
  main(`<div class="card"><h2>🎭 Ghép câu nhân hoá</h2><p class="sub">Chọn một cảnh vật, rồi chọn việc nó làm như một con người.</p>
    <div class="field"><label>1. Em chọn ai?</label><div class="chips" id="cs">${BUILD.map((b,i)=>`<button class="chip" data-i="${i}">${b.e} ${b.n}</button>`).join('')}</div></div>
    <div class="field"><label>2. Bạn ấy đang làm gì?</label><div class="chips" id="ca"><span class="legend">Chọn ở trên trước nhé</span></div></div>
    <div class="q" id="pre" style="min-height:70px;background:#fff7d6;border-radius:18px;padding:12px 16px">…</div>
    <div class="row"><button class="btn blue" id="rd" disabled>🔊 Nghe câu</button><button class="btn sun" id="nx" disabled>Câu của em nhân hoá thế nào? ➡️</button></div></div>`);
  say('Nhân hoá là cho cảnh vật có tên gọi và việc làm như con người. Bạn ghép một câu thật vui nhé!');
  const sentence=()=>`${BUILD[si].n} ${BUILD[si].acts[ai]}.`;
  const upd=()=>{const ok=si>=0&&ai>=0;$('#pre').textContent=ok?sentence():'…';$('#rd').disabled=!ok;$('#nx').disabled=!ok;};
  $$('#cs .chip').forEach(b=>b.onclick=()=>{$$('#cs .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');si=+b.dataset.i;ai=-1;
    $('#ca').innerHTML=BUILD[si].acts.map((a,i)=>`<button class="chip" data-i="${i}">${a}</button>`).join('');
    $$('#ca .chip').forEach(c=>c.onclick=()=>{$$('#ca .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');ai=+c.dataset.i;upd();});upd();});
  $('#rd').onclick=()=>speakText(sentence());
  $('#nx').onclick=()=>{const sen=sentence(),b=BUILD[si];
    main(`<div class="card"><h2>Câu của em</h2><div class="q" style="background:#fff7d6;border-radius:18px;padding:12px 16px">${esc(sen)}</div>
      <p class="sub">Câu này nhân hoá bằng cách nào? Chạm vào các cách đúng (có thể đúng cả hai).</p>
      <div class="opts" style="display:block">
       <button class="opt wide" data-r="1">🧑 Gọi “${esc(b.n.split(' ')[0].replace(/^Những$/,'chị'))}” như gọi một người<small>dùng từ chỉ người để gọi cảnh vật</small></button>
       <button class="opt wide" data-r="1">🎭 Tả bằng việc làm của người<small>“${esc(b.acts[ai])}” là việc người ta làm</small></button>
       <button class="opt wide" data-r="0">🔍 Dùng từ “như” để so sánh<small>so sánh một vật với một vật khác</small></button></div>
      <div class="row" id="nr"></div></div>`);
    say('Bạn thử tìm xem câu của mình mượn từ ngữ nào của con người nhé!','think');
    let got=0;$$('.opt').forEach(o=>o.onclick=()=>{
      if(o.classList.contains('ok')||o.classList.contains('soft'))return;
      if(o.dataset.r==='1'){o.classList.add('ok');got++;ding();
        if(got===2){addStar(2,'đặt câu nhân hoá');say('Đúng rồi! Câu của bạn vừa gọi như người, vừa có việc làm của người. Đó là nhân hoá!','cheer');$('#nr').innerHTML=`<button class="btn sun pulse" id="g">Viết câu của riêng em ➡️</button>`;$('#g').onclick=free;}
        else say(praise()+' Còn một cách nữa nhé!','cheer');}
      else{o.classList.add('soft');say('Câu của mình không có từ “như” đâu, nên đây chưa phải so sánh. Thử cách khác nhé!','think');}
    });
  };
  function free(){
    main(`<div class="card"><h2>✍️ ${F.title}</h2><p class="sub">${esc(F.prompt)}</p>
      ${fld('Câu của em','free',F.ph,3)}${chipRow('fs',F.starters)}
      <p class="legend">💡 Muốn đọc cho máy gõ thay: bấm 🎤 trên bàn phím iPad. Bố mẹ cũng có thể gõ giúp.</p>
      <div class="row"><button class="btn blue" id="rd2" disabled>🔊 Nghe lại câu</button><button class="btn sun" id="fin" disabled>Xong ✔</button></div></div>`);
    say('Giờ đến lượt bạn! Bạn viết câu của riêng bạn nhé. Câu nào cũng được, miễn là của bạn.','happy');
    const base=()=>S.free;const k='x_'+F.key;
    $('[data-k=free]').dataset.k=k;
    bindInputs($('.card'),chk,base);chipFill('fs',k,base,chk);
    function chk(){const t=S.free[k]||'';const ok=nWords(t)>=5;$('#fin').disabled=!ok;$('#rd2').disabled=!ok;}
    chk();$('#rd2').onclick=()=>speakText(S.free[k]);
    $('#fin').onclick=()=>{addStar(2,'tự viết câu');stepDone(A.id||STEPS[idx].id);say('Câu của bạn hay lắm!','cheer');setTimeout(nextOf(idx+1),1400);};
  }
}

// ---------- Bài 18: đặt câu với sáng tác / sáng tạo / sáng chế ----------
const WORD18=[
 {w:'sáng tác',hint:'đi với thơ, truyện, bài hát, bức tranh',ex:'Nhà thơ Phạm Hổ sáng tác nhiều bài thơ hay cho thiếu nhi.'},
 {w:'sáng tạo',hint:'đi với ý tưởng, cách làm mới',ex:'Trong giờ Mĩ thuật, bạn Nam luôn có nhiều ý tưởng sáng tạo.'},
 {w:'sáng chế',hint:'đi với máy móc, đồ vật mới',ex:'Ê-đi-xơn đã sáng chế ra bóng đèn sợi đốt.'}];
function stepWordSentence(){
  shell('1 · Đặt câu với từ mới',0);let wi=-1;
  main(`<div class="card"><h2>✏️ Đặt câu với từ trong bài</h2><p class="sub">Chọn một từ, rồi đặt 1 hoặc 2 câu có dùng từ đó. Nhớ viết hoa đầu câu và có dấu chấm cuối câu.</p>
    <div class="chips" id="wc">${WORD18.map((x,i)=>`<button class="chip" data-i="${i}">${x.w}</button>`).join('')}</div>
    <div id="wf"></div></div>`);
  say('Bạn chọn một từ: sáng tác, sáng tạo hoặc sáng chế, rồi đặt câu nhé!');
  $$('#wc .chip').forEach(c=>c.onclick=()=>{$$('#wc .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');wi=+c.dataset.i;const X=WORD18[wi];
    $('#wf').innerHTML=`<p class="legend">Gợi ý: “${X.w}” ${X.hint}.</p>${fld('Câu của em','x_w18_'+X.w,'Viết câu có từ “'+X.w+'”',3)}
      <div class="row"><button class="btn alt" id="ex">💡 Nghe câu mẫu</button><button class="btn sun" id="fin" disabled>Xong ✔</button></div>`;
    bindInputs($('#wf'),chk,()=>S.free);
    function chk(){const t=(S.free['x_w18_'+X.w]||'');$('#fin').disabled=!(nWords(t)>=5&&t.toLowerCase().includes(X.w));}
    chk();$('#ex').onclick=()=>{toast(X.ex);speakText(X.ex);};
    $('#fin').onclick=()=>{addStar(2,'đặt câu với từ mới');stepDone('x1');say('Câu của bạn có từ “'+X.w+'” rồi. Giỏi lắm!','cheer');setTimeout(stepPlan,1400);};
    say('Bạn nhớ nghĩa của từ này chứ? '+X.w+' '+X.hint+'.','happy',{mute:true});
  });
}

// ---------- Bài 18: tìm ý cho đoạn văn tưởng tượng ----------
const STORIES=['Sự tích cây vú sữa','Cô bé bán diêm','Cây khế','Thạch Sanh','Tấm Cám'];
const PLANS=[
 {k:'1a',t:'Bổ sung lời kể, tả · Cách 1',d:'Tả cụ thể tâm trạng và hành trình của nhân vật.',ex:'Tả nỗi nhớ mẹ của cậu bé và chuyến đi tìm mẹ vất vả, cuối cùng cậu tìm được mẹ.'},
 {k:'1b',t:'Bổ sung lời kể, tả · Cách 2',d:'Kể về sự thay đổi của nhân vật khi nhận ra lỗi lầm.',ex:'Cậu bé trở nên chăm chỉ, tự giác, làm theo lời mẹ khuyên bảo.'},
 {k:'2a',t:'Viết tiếp đoạn kết · Cách 1',d:'Viết một cái kết hạnh phúc, có hậu.',ex:'Mẹ trở về sau nhiều ngày đi tìm con, hai mẹ con gặp nhau trong hạnh phúc.'},
 {k:'2b',t:'Viết tiếp đoạn kết · Cách 2',d:'Hoá ra mọi chuyện chỉ là một giấc mơ.',ex:'Các việc trong truyện chỉ là do cậu bé ngủ mơ. Em nêu cảm nghĩ khi nhớ lại giấc mơ đáng sợ.'},
 {k:'x',t:'Phương án khác · theo ý em',d:'Em tự nghĩ ra cách tưởng tượng của mình.',ex:'Ví dụ: thêm một nhân vật mới, thêm một phép màu…'}];
function stepPlan(){
  shell('2 · Chọn truyện, chọn cách viết',1);const o=W18();
  main(`<div class="card"><h2>📚 Em chọn câu chuyện nào?</h2><p class="sub">Chọn một câu chuyện em đã đọc hoặc đã nghe và thích.</p>
    <div class="chips" id="sc">${STORIES.map(x=>`<button class="chip ${o.story===x?'on':''}" data-s="${esc(x)}">${esc(x)}</button>`).join('')}<button class="chip ${o.story==='*'?'on':''}" data-s="*">✏️ Truyện khác</button></div>
    <div id="oth"></div></div>
    <div class="card"><h2>🧭 Em muốn tưởng tượng theo cách nào?</h2>
    <div class="grid3">${PLANS.map(p=>`<button class="pick ${o.plan===p.k?'ok':''}" data-p="${p.k}"><b>${p.t}</b><br>${esc(p.d)}<br><small>${esc(p.ex)}</small></button>`).join('')}</div>
    <div class="row"><button class="btn sun" id="nx" disabled>Sang tìm ý ➡️</button></div></div>`);
  say('Bạn chọn một câu chuyện, rồi chọn cách tưởng tượng nhé. Bạn có thể thêm lời kể, lời tả, hoặc viết tiếp đoạn kết.');
  const chk=()=>{const okS=o.story&&(o.story!=='*'||o.other.trim());$('#nx').disabled=!(okS&&o.plan);};
  const showOth=()=>{$('#oth').innerHTML=o.story==='*'?fld('Tên câu chuyện của em','other','Ví dụ: Thánh Gióng'):'';if(o.story==='*')bindInputs($('#oth'),chk,W18);};
  $$('#sc .chip').forEach(c=>c.onclick=()=>{o.story=c.dataset.s;save();$$('#sc .chip').forEach(x=>x.classList.toggle('on',x===c));showOth();chk();});
  $$('[data-p]').forEach(b=>b.onclick=()=>{o.plan=b.dataset.p;save();$$('[data-p]').forEach(x=>x.classList.toggle('ok',x===b));chk();});
  showOth();chk();
  $('#nx').onclick=()=>{addStar(1,'đã chọn truyện');stepDone('x2');stepIdeas(0);};
}
const storyName=()=>{const o=W18();return o.story==='*'?(o.other||'câu chuyện của em'):(o.story||'câu chuyện của em');};
const IDEA_PARTS=['Mở đầu','Triển khai','Kết thúc'];
function stepIdeas(part){
  shell('3 · Tìm ý: '+IDEA_PARTS[part],2);const o=W18();
  const dots=`<div class="dots">${IDEA_PARTS.map((_,k)=>`<i class="${k<part?'on':''} ${k===part?'cur':''}"></i>`).join('')}</div>`;
  if(part===0){
    if(!o.idea&&o.plan){const p=PLANS.find(x=>x.k===o.plan);if(p&&p.k!=='x'){/* không điền sẵn, để con tự nghĩ */}}
    main(dots+`<div class="card"><h2>🚪 Mở đầu</h2><p class="sub">Giới thiệu tên câu chuyện đã gợi cho em những liên tưởng, tưởng tượng.</p>
      <p class="q">Câu chuyện: <b>${esc(storyName())}</b></p>
      ${fld('Em muốn tưởng tượng điều gì?','idea','Ví dụ: Em muốn thay đổi kết thúc buồn bằng một cái kết ấm áp hơn.',3)}${chipRow('ic',['Em muốn tưởng tượng thêm','Em muốn viết tiếp đoạn kết:','Em muốn tả kĩ hơn'])}
      <div class="row"><button class="btn alt" id="bk">⬅️ Chọn lại</button><button class="btn sun" id="nx" disabled>Sang triển khai ➡️</button></div></div>`);
    say('Mở đầu là cổng vào. Bạn nói tên câu chuyện và điều bạn muốn tưởng tượng nhé.');
    const chk=()=>{$('#nx').disabled=nWords(o.idea)<4;};bindInputs($('.card'),chk,W18);chipFill('ic','idea',W18,chk);chk();
    $('#bk').onclick=stepPlan;$('#nx').onclick=()=>{addStar(1,'xong mở đầu');stepIdeas(1);};
  }
  if(part===1){
    main(dots+`<div class="card"><h2>🛤️ Triển khai</h2><p class="sub">Kể, tả lại những gì em tưởng tượng. Cố gắng tạo sự bất ngờ, thú vị cho người đọc. Có thể dùng nhân hoá, so sánh.</p>
      ${fld('1. Hoàn cảnh: việc xảy ra ở đâu, lúc nào, nhân vật đang làm gì?','setting','Ví dụ: Cậu bé ôm thân cây vú sữa khóc vì nhớ mẹ.',2)}
      ${fld('2. Điều bất ngờ, thú vị em tưởng tượng ra là gì?','twist','Ví dụ: Từ xa, một bóng dáng quen thuộc đang bước về cổng nhà.',3)}${chipRow('tc',['Bỗng nhiên','Thì ra','Không ngờ'])}
      ${fld('3. Sau đó nhân vật làm gì, cảm thấy ra sao?','result','Ví dụ: Cậu bé chạy tới ôm mẹ và xin lỗi mẹ.',2)}
      <div class="row"><button class="btn alt" id="bk">⬅️ Mở đầu</button><button class="btn sun" id="nx" disabled>Sang kết thúc ➡️</button></div></div>`);
    say('Triển khai là con đường phiêu lưu. Điều bất ngờ là phần quan trọng nhất. Bạn nghĩ xem câu chuyện sẽ có điều gì thú vị nhé!');
    const chk=()=>{$('#nx').disabled=!(nWords(o.twist)>=5&&nWords(o.setting)>=3);};bindInputs($('.card'),chk,W18);chipFill('tc','twist',W18,chk);chk();
    $('#bk').onclick=()=>stepIdeas(0);$('#nx').onclick=()=>{addStar(1,'xong triển khai');stepIdeas(2);};
  }
  if(part===2){
    main(dots+`<div class="card"><h2>🏆 Kết thúc</h2><p class="sub">Nêu cảm nghĩ của em hoặc gợi ra những điều tưởng tượng tiếp theo.</p>
      ${fld('Em nghĩ gì về câu chuyện này?','feel','Ví dụ: Tình mẹ con là điều quý giá, em muốn luôn yêu thương mẹ.',3)}${chipRow('fc',['Em nghĩ rằng','Em rất yêu thích','Em muốn biết thêm'])}
      ${fld('Điều tưởng tượng tiếp theo (không bắt buộc)','next','Ví dụ: Không biết cây vú sữa sẽ còn cho quả ngọt bao nhiêu mùa nữa.',2)}
      <div class="row"><button class="btn alt" id="bk">⬅️ Triển khai</button><button class="btn sun" id="nx" disabled>Xong ✔</button></div></div>`);
    say('Kết thúc là điều đọng lại trong lòng người đọc. Bạn nói cảm nghĩ của bạn nhé!');
    const chk=()=>{$('#nx').disabled=nWords(o.feel)<4;};bindInputs($('.card'),chk,W18);chipFill('fc','feel',W18,chk);chk();
    $('#bk').onclick=()=>stepIdeas(1);$('#nx').onclick=()=>{addStar(1,'xong kết thúc');stepDone('x3');stepIdeaCheck();};
  }
}
function ideaParts(){const o=W18();
  return {m:[`Câu chuyện: ${storyName()}`,o.idea&&`Điều em tưởng tượng: ${o.idea.trim()}`],
          t:[o.setting&&`Hoàn cảnh: ${o.setting.trim()}`,o.twist&&`Điều bất ngờ: ${o.twist.trim()}`,o.result&&`Sau đó: ${o.result.trim()}`],
          k:[o.feel&&`Cảm nghĩ: ${o.feel.trim()}`,o.next&&`Điều tưởng tượng tiếp theo: ${o.next.trim()}`]};}
function ideaText(){const p=ideaParts();const f=a=>a.filter(Boolean).map(x=>'- '+x).join('\n');return `TÌM Ý ĐOẠN VĂN TƯỞNG TƯỢNG\nMở đầu\n${f(p.m)}\nTriển khai\n${f(p.t)}\nKết thúc\n${f(p.k)}`;}
function stepIdeaCheck(){
  shell('4 · Kiểm tra & chỉnh sửa',3);const o=W18(),p=ideaParts();
  const crit=[{ok:nWords(o.idea)>=4&&nWords(o.setting)>=3,t:'Trình bày rõ những điều đã tưởng tượng',fix:'Bổ sung',go:()=>stepIdeas(0)},
              {ok:nWords(o.twist)>=5,t:'Nội dung tưởng tượng thể hiện sự sáng tạo (có điều bất ngờ, thú vị)',fix:'Thêm điều bất ngờ',go:()=>stepIdeas(1)},
              {ok:nWords(o.feel)>=4,t:'Có đủ mở đầu, triển khai, kết thúc',fix:'Thêm kết thúc',go:()=>stepIdeas(2)}];
  const all=crit.every(c=>c.ok);
  const box=(c,h,l)=>`<div class="ol ${c}"><h4>${h}</h4>${l.filter(Boolean).map(x=>`<div>• ${esc(x)}</div>`).join('')}</div>`;
  main(`<div class="card"><h2>Ý của ${esc(nm())}</h2>${box('m','🚪 Mở đầu',p.m)}${box('t','🛤️ Triển khai',p.t)}${box('k','🏆 Kết thúc',p.k)}
    <div class="row"><button class="btn blue" id="rd">🔊 Miu-Bot đọc ý</button><button class="btn alt" id="cp">📋 Sao chép</button></div></div>

  main(`<div class="card"><h2>📘 Phiếu đọc sách</h2><p class="sub">Em đọc sách báo về khoa học và công nghệ rồi ghi phiếu. Gợi ý: <i>Mười vạn câu hỏi vì sao</i>, <i>Tìm hiểu về các phát minh</i>, <i>Một trăm phát minh làm nên lịch sử</i>.</p>
    ${fld('Tên sách báo','title','Ví dụ: Một trăm phát minh làm nên lịch sử')}${fld('Tác giả','author','Em có thể nhờ bố mẹ xem trên bìa sách')}${fld('Ngày đọc','date','')}
    ${fld('Nội dung chính','main','Cuốn sách nói về điều gì?',2)}${fld('Kiến thức hoặc phát minh khoa học được nói tới','know','Ví dụ: bóng đèn điện',2)}${fld('Thông tin bổ ích đối với em','useful','Em học được điều gì?',2)}
    <div class="field"><label>Mức độ yêu thích</label><div class="stars5" id="st5">${[1,2,3,4,5].map(i=>`<button class="starbtn ${B.stars>=i?'on':''}" data-v="${i}">⭐</button>`).join('')}</div></div>
    <div class="row"><button class="btn sun" id="fin" disabled>🎉 Xong phiếu!</button></div></div>`);
  say('Bạn ghi phiếu đọc sách nhé. Nếu chưa đọc sách nào, bạn nhờ bố mẹ tìm một cuốn nói về phát minh để đọc, rồi quay lại ghi.');
  bindInputs($('.card'),chk,BOOK);
  $$('#st5 .starbtn').forEach(b=>b.onclick=()=>{B.stars=+b.dataset.v;save();$$('#st5 .starbtn').forEach(x=>x.classList.toggle('on',+x.dataset.v<=B.stars));chk();});
  function chk(){$('#fin').disabled=!(B.title.trim()&&nWords(B.main)>=3&&nWords(B.useful)>=3&&B.stars>0);}
  chk();$('#fin').onclick=()=>{addStar(3,'xong phiếu đọc sách');stepDone('z4');rewardW('🍂','Nhà quan sát bầu trời','đã hoàn thành bài 20','Quà từ túi thần kỳ của Miu-Bot: 🔭 chiếc kính thiên văn nhỏ. Bạn đọc phiếu cho người thân nghe nhé!');};
}
const STEPS20W=[
 {id:'z1',n:'1',e:'☁️',t:'Đặt câu tả bầu trời',s:'5 phút',f:()=>stepBuild(0,{id:'z1'})},
 {id:'z2',n:'2',e:'🧐',t:'Trả bài: tự nhận xét',s:'4 phút',f:()=>stepReview()},
 {id:'z3',n:'3',e:'✨',t:'Viết lại câu cho hay',s:'4 phút',f:()=>stepRewrite()},
 {id:'z4',n:'4',e:'📘',t:'Phiếu đọc sách',s:'4 phút',f:()=>stepBook()}
];

// ---------- Trang bố mẹ: bài viết của con ----------
function writingSummary(){
  const out=[];const pre=t=>`<div style="white-space:pre-wrap;background:#f6fbff;border-radius:14px;padding:10px 14px;font-size:17px;margin:6px 0">${esc(t)}</div>`;
  const fr=Object.entries(S.free||{}).filter(([k,v])=>String(v).trim()&&!/^b\d+_/.test(k));
  if(fr.length)out.push(`<h4>Câu con đã viết</h4>${fr.map(([k,v])=>pre(v)).join('')}`);
  if(S.w18&&(S.w18.idea||S.w18.twist))out.push(`<h4>Ý cho đoạn văn tưởng tượng (bài 18)</h4>${pre(ideaText())}`);
  if(S.sp&&S.sp.name)out.push(`<h4>Bài nói giới thiệu sản phẩm (bài 18)</h4>${pre(speechText())}`);
  if((S.para||'').trim())out.push(`<h4>Đoạn văn tưởng tượng (bài 19)</h4>${pre(S.para)}`);
  if(S.rev&&S.rev.nw)out.push(`<h4>Câu viết lại (bài 20)</h4>${pre('Cũ: '+(S.rev.old||'')+'\nMới: '+S.rev.nw)}`);
  if(S.book&&S.book.title)out.push(`<h4>Phiếu đọc sách (bài 20)</h4>${pre(`Sách: ${S.book.title}\nTác giả: ${S.book.author}\nNgày đọc: ${S.book.date}\nNội dung chính: ${S.book.main}\nKiến thức, phát minh: ${S.book.know}\nThông tin bổ ích: ${S.book.useful}\nYêu thích: ${S.book.stars}/5 sao`)}`);
  lessonList().forEach(l=>allForms(l).forEach(F=>{if(F.sum===undefined)return;const any=F.fields.some(f=>fGet(l.id,F.id,f.k));if(any)out.push(`<h4>Bài ${l.num} · ${esc(F.sum)}</h4>${pre(formText(l,F))}`);}));
  return out.length?`<h3>Bài viết của con</h3><p class="legend">Bố mẹ đọc cùng con, khen một điều con làm tốt trước khi góp ý. Nhớ chỉ sửa một hai lỗi mỗi lần.</p>${out.join('')}`:'';
}

// ===== BÀI 21 TRỞ ĐI: BUỔI LUYỆN TẬP KHAI BÁO BẰNG DỮ LIỆU + MỤC LỤC =====
function mkLesson(o){
  const sessions=[{name:'📖 Buổi 1 · Đọc hiểu',steps:()=>readSteps()}].concat(o.sessions.map(s=>({name:s.name,hello:s.hello,badge:s.badge,W:s.W,steps:()=>wSteps(s.W)})));
  return Object.assign({id:o.id,num:o.num,short:o.short,title:o.title,parent:o.parent,sessions},o.data);
}
LESSON_DEFS.forEach(d=>{LESSONS[d.id]=mkLesson(d);});
// sắp xếp lại theo số bài
(function(){const e=Object.values(LESSONS).sort((a,b)=>a.num-b.num);for(const k of Object.keys(LESSONS))delete LESSONS[k];e.forEach(l=>{LESSONS[l.id]=l;});})();

function wSteps(W){return W.map((d,i)=>({id:d.id,n:String(i+1),e:d.e,t:d.t,s:d.s||'4 phút',f:()=>runW(W,i)}));}
function runW(W,i){
  const d=W[i],title=`${i+1} · ${d.t}`;
  const ss=curSess();
  const after=()=>{if(i+1<W.length&&STEPS[i+1])STEPS[i+1].f();else{const b=ss.badge||{e:'🏅',name:'Chăm chỉ',text:'đã hoàn thành',gift:''};rewardW(b.e,b.name,b.text,b.gift);}};
  if(d.type==='quiz')stepQuiz(0,{list:d.list,idx:i,title,id:d.id,mk:d.id+'.',after,intro:d.intro||'Bạn nghe câu hỏi rồi chọn đáp án nhé.'});
  else if(d.type==='sort')stepSort(d.cfg,{idx:i,pre:(i+1)+' · ',id:d.id,next:after});
  else if(d.type==='order')stepOrderGame({cards:d.cards,idx:i,title,h:d.h,sub:d.sub,say:d.say,win:d.win,id:d.id,after});
  else if(d.type==='form')runForm(d,i,title,after);
  else if(d.type==='check')runCheck(d,i,title,after);
  else if(d.type==='tell')runTell(d,i,title,after);
}
// --- tìm biểu mẫu theo id (để lấy dữ liệu của bước trước)
const fPre=(lid,fid)=>lid+'_'+fid+'_';
const fGet=(lid,fid,k)=>{const v=S.free[fPre(lid,fid)+k];return (v==null?'':String(v)).trim();};
function formText(l,F){const g=k=>fGet(l.id,F.id,k),x=(fid,k)=>fGet(l.id,fid,k);return F.build?F.build(g,x):F.fields.map(f=>f.l+': '+g(f.k)).join('\n');}
function allForms(l){return l.sessions.flatMap(s=>(s.W||[]).filter(d=>d.type==='form'));}
function findForm(l,id){return allForms(l).find(f=>f.id===id);}

function runForm(F,i,title,after){
  shell(title,i);
  const P=fPre(L.id,F.id);const base=()=>S.free;
  const g=k=>(S.free[P+k]||'').trim(),x=(fid,k)=>fGet(L.id,fid,k);
  const preview=()=>F.build?F.build(g,x):'';
  main(`<div class="card"><h2>${F.h}</h2><p class="sub">${esc(F.sub||'')}</p>${F.tip?`<p class="legend">${esc(F.tip)}</p>`:''}
    ${F.fields.map(f=>fld(f.l,P+f.k,f.ph,f.rows||2)).join('')}
    ${(F.chips||[]).map((c,j)=>`<div class="field"><label>${esc(c.label||'Gợi ý')}</label>${chipRow('fc'+j,c.list)}</div>`).join('')}
    ${F.rate?`<div class="field"><label>Mức độ yêu thích</label><div class="stars5" id="st5">${[1,2,3,4,5].map(v=>`<button class="starbtn" data-v="${v}">⭐</button>`).join('')}</div></div>`:''}
    ${F.build?`<div class="q" id="pv" style="white-space:pre-wrap;background:#f6fbff;border-radius:18px;padding:12px 16px;font-size:18px;min-height:50px"></div>`:''}
    <div class="row"><button class="btn blue" id="rd2" disabled>🔊 Nghe lại</button><button class="btn sun" id="fin" disabled>Xong ✔</button></div></div>`);
  say(F.say||'Bạn viết bằng lời của mình nhé!','happy');
  const ok=()=>{
    const reqs=F.fields.filter(f=>f.req||F.need);const sat=reqs.filter(f=>nWords(g(f.k))>=(f.min||F.minw||3)).length;
    const need=F.need||reqs.length;const rated=!F.rate||+(S.free[P+'stars']||0)>0;
    return sat>=need&&rated;};
  const chk=()=>{const o=ok();$('#fin').disabled=!o;$('#rd2').disabled=!o;const pv=$('#pv');if(pv)pv.textContent=preview();};
  bindInputs($('.card'),chk,base);
  (F.chips||[]).forEach((c,j)=>chipFill('fc'+j,P+c.to,base,chk));
  if(F.rate){const cur=+(S.free[P+'stars']||0);$$('#st5 .starbtn').forEach(b=>{b.classList.toggle('on',+b.dataset.v<=cur);b.onclick=()=>{S.free[P+'stars']=String(b.dataset.v);save();$$('#st5 .starbtn').forEach(y=>y.classList.toggle('on',+y.dataset.v<=+b.dataset.v));chk();};});}
  chk();
  $('#rd2').onclick=()=>speakText(F.build?preview():F.fields.map(f=>g(f.k)).join('. '));
  $('#fin').onclick=()=>{addStar(F.star||2,F.why||'viết bài');stepDone(F.id);say(F.win||'Bạn viết hay lắm!','cheer');confetti();setTimeout(after,1500);};
}

function runCheck(d,i,title,after){
  shell(title,i);
  const F=d.show?findForm(L,d.show):null;const txt=F?formText(L,F):'';
  main(`<div class="card"><h2>${d.h}</h2><p class="sub">${esc(d.sub||'')}</p>
    ${txt?`<div class="q" style="white-space:pre-wrap;background:#f6fbff;border-radius:18px;padding:12px 16px;font-size:18px">${esc(txt)}</div><div class="row"><button class="btn blue" id="rd2">🔊 Nghe lại bài</button></div>`:'<p class="legend">Em chưa viết ở bước trước. Em vẫn có thể đọc các điều dưới đây rồi tự kiểm tra bài của mình nhé.</p>'}
    <div class="opts" style="display:block">${d.items.map((t,j)=>`<button class="opt wide" data-j="${j}">☐ ${esc(t)}</button>`).join('')}</div>
    <div class="row"><button class="btn sun" id="fin" disabled>Xong ✔</button></div></div>`);
  say(d.say||'Bạn đọc lại bài và kiểm tra từng điều nhé.','happy');
  if(txt)$('#rd2').onclick=()=>speakText(txt);
  let n=0;$$('.opt').forEach(b=>b.onclick=()=>{b.classList.toggle('ok');const on=b.classList.contains('ok');b.firstChild.textContent=(on?'☑ ':'☐ ')+d.items[+b.dataset.j];n+=on?1:-1;$('#fin').disabled=n<d.items.length;if(on)ding();});
  $('#fin').onclick=()=>{addStar(d.star||2,'tự kiểm tra bài');stepDone(d.id);say(d.win||'Giỏi lắm!','cheer');confetti();setTimeout(after,1500);};
}

function runTell(d,i,title,after){
  shell(title,i);let p=0;
  const show=()=>{const pg=d.pages[p];
    main(`<div class="card"><h2>${esc(d.h)}</h2><p class="sub">${esc(d.sub||'')}</p>
      <div class="big" style="font-size:64px;text-align:center">${pg.e}</div>
      <div class="q" style="background:#fff7d6;border-radius:18px;padding:14px 18px;font-size:22px;line-height:1.6">${esc(pg.t)}</div>
      <p class="legend">Tranh ${p+1} trên ${d.pages.length}</p>
      <div class="row"><button class="btn blue" id="rd2">🔊 Nghe</button><button class="btn sun" id="nx">${p<d.pages.length-1?'Tranh tiếp theo ➡️':'Nghe xong rồi ✔'}</button></div></div>`);
    $('#rd2').onclick=()=>speakText(pg.t);
    $('#nx').onclick=()=>{stopSpeech();if(p<d.pages.length-1){p++;show();}else{addStar(1,'nghe truyện');stepDone(d.id);after();}};
    say(pg.t,'happy');};
  show();
}

// ===== Câu hỏi sai theo nhóm bước (cho trang bố mẹ) =====
function quizMissLabel(rest){
  if(/^\d+$/.test(rest))return QUIZ[+rest]?QUIZ[+rest].q:'';
  const m=rest.match(/^(\w+)\.(\d+)$/);if(!m)return '';
  for(const s of L.sessions)for(const d of (s.W||[]))if(d.id===m[1]&&d.list&&d.list[+m[2]])return d.list[+m[2]].q;
  return '';
}

// ===== MỤC LỤC =====
function lessonProg(l){const d=l.id==='b10'?S.done:(S.dl[l.id]||{});const st=l.sessions.flatMap(x=>x.steps());return {n:st.filter(s=>d[s.id]).length,t:st.length};}
function lessonList(){return Object.values(LESSONS).sort((a,b)=>a.num-b.num);}
function lessonBar(){
  const ls=lessonList(),ix=ls.findIndex(l=>l.id===L.id),p=lessonProg(L);
  return `<div class="lbar"><button class="hbtn2" id="lprev" ${ix<=0?'disabled':''} aria-label="Bài trước">◀</button>
    <button class="tocbtn" id="toc"><span>📚 Mục lục</span><b>Bài ${L.num} · ${esc(L.title)}</b><small>${p.n}/${p.t} bước đã xong</small></button>
    <button class="hbtn2" id="lnext" ${ix>=ls.length-1?'disabled':''} aria-label="Bài sau">▶</button></div>`;
}
function bindLessonBar(){
  const ls=lessonList(),ix=ls.findIndex(l=>l.id===L.id);
  const go=l=>{stopSpeech();setLesson(l.id);home();};
  $('#toc').onclick=()=>tocScreen();
  if(ix>0)$('#lprev').onclick=()=>go(ls[ix-1]);
  if(ix<ls.length-1)$('#lnext').onclick=()=>go(ls[ix+1]);
}
function tocScreen(){
  stopSpeech();
  shell('Mục lục · Tiếng Việt 4',-1);
  const have=lessonList().length;
  const tile=(n,t)=>{const l=LESSONS['b'+n];
    if(!l)return `<div class="lt off"><b>Bài ${n}</b><span>${esc(t)}</span><small>🔒 sắp có</small></div>`;
    const p=lessonProg(l);const full=p.n>=p.t&&p.t>0;
    return `<button class="lt ${l.id===L.id?'on':''} ${full?'full':''}" data-l="${l.id}"><b>Bài ${n} ${full?'✅':''}</b><span>${esc(t)}</span><small>${p.n}/${p.t} bước</small></button>`;};
  main(`<p class="sub" style="text-align:center">Đã có <b>${have}</b> trong 32 bài của tập một. Chạm vào một bài để học.</p>
    ${CATALOG.map(th=>`<div class="theme"><h3>${th.e} ${esc(th.name)}</h3>
      ${th.weeks.map(w=>w.r?`<div class="wk"><span class="wn">Tuần ${w.w}</span><div class="rv">📝 ${esc(w.r)}</div></div>`:`<div class="wk"><span class="wn">Tuần ${w.w}</span><div class="lts">${w.l.map(([n,t])=>tile(n,t)).join('')}</div></div>`).join('')}</div>`).join('')}
    <div class="row"><button class="btn" id="back">⬅ Quay lại</button></div>`);
  $$('.lt[data-l]').forEach(b=>b.onclick=()=>{setLesson(b.dataset.l);home();});
  $('#back').onclick=()=>home();
  const cur=$('.lt.on');if(cur)setTimeout(()=>cur.scrollIntoView({block:'center'}),50);
  say('Đây là mục lục sách. Bạn chạm vào bài muốn học nhé!','happy',{mute:true});
}

setLesson(S.lesson);
home();
